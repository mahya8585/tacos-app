<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3137"/>
      <stop offset="1" stop-color="#171a1f"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="110" y="95" width="380" height="210" rx="20" fill="#e9ecef"/>
  <rect x="130" y="115" width="340" height="170" rx="14" fill="#aab2bd" opacity="0.45"/>
  <text x="300" y="205" text-anchor="middle" fill="#eef2f7" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="1.8">FOOD PHOTO</text>
  <text x="300" y="248" text-anchor="middle" fill="#d5dce6" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="1.1">COMING SOON</text>
  <rect width="600" height="400" filter="url(#grain)"/>
</svg>
