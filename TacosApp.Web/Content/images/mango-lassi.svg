<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a271f"/>
      <stop offset="1" stop-color="#17110e"/>
    </linearGradient>
    <linearGradient id="drink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9a3"/>
      <stop offset="1" stop-color="#f0a34d"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="2" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="220" y="82" width="160" height="236" rx="24" fill="#fff4df" opacity="0.85"/>
  <rect x="236" y="108" width="128" height="186" rx="18" fill="url(#drink)"/>
  <ellipse cx="300" cy="108" rx="64" ry="13" fill="#fff2db"/>
  <g fill="#ffd49b" opacity="0.65">
    <rect x="252" y="132" width="18" height="18" rx="4"/><rect x="298" y="166" width="20" height="20" rx="4"/><rect x="272" y="212" width="18" height="18" rx="4"/>
  </g>
  <circle cx="332" cy="132" r="22" fill="#f9c971"/>
  <circle cx="332" cy="132" r="14" fill="#e7a13c"/>
  <rect x="334" y="52" width="12" height="88" rx="6" fill="#fff0d8" transform="rotate(15 340 96)"/>
  <rect width="600" height="400" filter="url(#grain)"/>
  <text x="28" y="370" fill="#ffeacc" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="1.8">MANGO LASSI</text>
</svg>
