<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f2e24"/>
      <stop offset="1" stop-color="#1f1712"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#f7f4ef"/>
      <stop offset="1" stop-color="#d8d2c8"/>
    </radialGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="2"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.06"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <ellipse cx="300" cy="210" rx="225" ry="145" fill="url(#plate)"/>
  <ellipse cx="300" cy="210" rx="185" ry="105" fill="#7a4a2e" opacity="0.25"/>
  <ellipse cx="230" cy="190" rx="95" ry="42" fill="#c7984f"/>
  <ellipse cx="345" cy="220" rx="105" ry="45" fill="#b47f3d"/>
  <ellipse cx="265" cy="187" rx="80" ry="22" fill="#5f2f1d"/>
  <ellipse cx="370" cy="218" rx="80" ry="24" fill="#5b2b19"/>
  <g fill="#5ea54f" opacity="0.9">
    <circle cx="205" cy="222" r="10"/><circle cx="248" cy="236" r="8"/><circle cx="300" cy="166" r="9"/>
    <circle cx="350" cy="252" r="8"/><circle cx="390" cy="180" r="7"/>
  </g>
  <ellipse cx="280" cy="150" rx="120" ry="26" fill="#ffffff" opacity="0.2" filter="url(#soft)"/>
  <rect width="600" height="400" filter="url(#grain)"/>
  <text x="28" y="370" fill="#f8e9d7" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="1.8">CLASSIC BEEF TACO</text>
</svg>
