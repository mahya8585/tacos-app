<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#203027"/>
      <stop offset="1" stop-color="#111a15"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7fff4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7be3c6" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="15"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="220" y="80" width="160" height="240" rx="24" fill="url(#glass)"/>
  <rect x="236" y="108" width="128" height="184" rx="18" fill="#9ff0d6" opacity="0.9"/>
  <g fill="#b7ffe4" opacity="0.6">
    <rect x="248" y="128" width="20" height="20" rx="4"/>
    <rect x="304" y="162" width="20" height="20" rx="4"/>
    <rect x="270" y="210" width="18" height="18" rx="4"/>
  </g>
  <circle cx="300" cy="172" r="48" fill="#9de051"/>
  <circle cx="300" cy="172" r="36" fill="#6fbd3d"/>
  <rect x="338" y="52" width="12" height="92" rx="6" fill="#d3fff2" transform="rotate(18 344 98)"/>
  <rect width="600" height="400" filter="url(#grain)"/>
  <text x="28" y="370" fill="#e6f8ef" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="1.8">LIME SODA</text>
</svg>
