      <stop offset="1" stop-color="#121d17"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="44%" r="60%">
      <stop offset="0" stop-color="#f5f6f2"/>
      <stop offset="1" stop-color="#ccd0c8"/>
