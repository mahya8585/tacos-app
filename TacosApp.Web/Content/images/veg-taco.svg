  </g>
  <rect width="600" height="400" filter="url(#grain)"/>
  <text x="28" y="370" fill="#e7f5ea" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="1.8">VEGGIE TACO</text>
